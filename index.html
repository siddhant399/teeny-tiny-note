<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny, gentle apology note."
    />
    <title>A tiny note</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene" aria-labelledby="apology-title">
      <div class="background-glow glow-one" aria-hidden="true"></div>
      <div class="background-glow glow-two" aria-hidden="true"></div>
      <div class="floating-hearts" aria-hidden="true"></div>

      <section class="letter-card">
        <div class="stamp" aria-hidden="true">♡</div>
        <p class="eyebrow">a tiny note from me</p>
        <h1 id="apology-title">I’m sorry, <span id="recipient-name">you</span>.</h1>
        <p class="lead" id="intro-copy"></p>
        <p class="body-copy" id="detail-copy"></p>

        <div class="return-note" aria-live="polite">
          <span class="return-note__sparkle" aria-hidden="true">✦</span>
          <p id="return-copy"></p>
        </div>

        <div class="actions">
          <button class="button button--primary" id="heart-button" type="button">
            Send a little heart <span aria-hidden="true">♥</span>
          </button>
          <button class="button button--quiet" id="space-button" type="button">
            I need a little space
          </button>
        </div>

        <p class="response" id="response" role="status" aria-live="polite"></p>
        <p class="signature" id="signature-copy"></p>
      </section>

      <p class="footer-note">No pressure. This little page will wait patiently.</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
